name: Dependabot のライセンス一覧

# Dependabot の cargo の PR に、作り直したライセンス一覧を積む（handball-project#842）。
#
# Dependabot は Cargo.lock しか書き換えず、THIRD_PARTY_LICENSES.json / .md を作り直さない。
# 依存の版が変わると ci.yml の「ライセンス一覧が最新か」（generate_licenses.sh --check）で
# 必ず落ちるので、毎回人が Dependabot のブランチを取り出して作り直し、PR に積んでいた
# （handball-project#530・#583・#714・#798・#841 の 5 回。差分はほぼ版の文字列だけ）。
#
# ── 流れ ──
#
#   1. regenerate（macOS・読み取りのみ）: PR の head で generate_licenses.sh を回す。
#      差分が無ければここで終わる。あれば 2 ファイルを artifact に置く
#   2. push（ubuntu・書き込み）: artifact の 2 ファイルを PR のブランチへ commit して push し、
#      ci.yml を workflow_dispatch で呼び直す
#
# ── 書き込める token を、第三者のコードが走る job に置かない ──
#
# 1 では cargo-about が依存の crate を取ってきて本文を読み、Nix がツールチェーンを入れる。
# 書き込める token をその job に持たせると、そこで走ったものから盗める（runner のメモリから
# 抜かれた例がある。tj-actions/changed-files）。だから job を分け、1 は contents: read のまま、
# 2 は git と gh しか動かさない。2 が受け取るのは artifact の 2 ファイルだけで、ほかの
# ファイルが動いていたら push しない。
#
# ── pull_request_target を使わない ──
#
# pull_request_target は base の workflow を書き込める token 付きで走らせるので、PR の
# head を checkout した瞬間に PR の中身が token に届く（いわゆる pwn request）。
# Dependabot が起こした pull_request は「fork から来たもの」と同じ扱いで token は読み取り
# のみになるが、`permissions:` で上げられる（GitHub の docs「Troubleshooting Dependabot
# on GitHub Actions」）。fork から来た PR はどう書いても読み取りのみなので上げられない。
# 走らせる条件も「PR を出したのが dependabot[bot]」かつ「head がこのリポのブランチ」に絞る。
# github.actor は見ない（最後にその PR を動かした人なので、人が積めば人になる）。
#
# ── GITHUB_TOKEN の push では required check が走らない ──
#
# GITHUB_TOKEN で積んだ commit の pull_request イベントは、CI を「承認待ち」の状態でしか
# 作らない（GitHub の docs「GITHUB_TOKEN」）。承認するまで required check の `check` が
# 新しい commit に付かず、auto-merge の予約が発火しない。例外は workflow_dispatch で、
# GITHUB_TOKEN からでも普通に走る。だから 2 の最後に ci.yml を PR のブランチで呼び直す。
# 承認待ちの run は残るが、放っておいてよい（`check` は呼び直した run が付ける）。
#
# ── 止まるとき ──
#
#   - accepted に無いライセンスが入った: 1 の generate_licenses.sh が落ちる（about.toml の
#     `--fail`）。ライセンスを受け入れるかは人が決めるので、ここでは何も積まない
#   - 作り直しの間にブランチが動いた: 2 は push しない。動かした push で 1 からやり直しになる
on:
  pull_request:
    paths:
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    # flake.nix は aarch64-darwin 固定（ci.yml と同じ理由）
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # ci.yml が main で保存した Nix store を復元だけする（保存すると main のキャッシュを
      # 押し出す。ci.yml の「保存は main だけ」）。Dependabot の cargo の PR は flake を
      # 動かさないので完全一致する
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
          paths: |
            /nix
            ~/.cache/nix

      - name: ライセンス一覧を作り直す
        run: nix develop --command ./scripts/generate_licenses.sh

      - name: 差分を見る
        id: diff
        run: |
          set -euo pipefail
          others=$(git status --porcelain --untracked-files=no -- . ':!THIRD_PARTY_LICENSES.json' ':!THIRD_PARTY_LICENSES.md')
          if [ -n "$others" ]; then
            echo "error: ライセンス一覧の外のファイルが動いた。何も積まない" >&2
            echo "$others" >&2
            exit 1
          fi
          if git diff --quiet -- THIRD_PARTY_LICENSES.json THIRD_PARTY_LICENSES.md; then
            echo "ライセンス一覧は最新。積むものは無い"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- THIRD_PARTY_LICENSES.json THIRD_PARTY_LICENSES.md
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: third-party-licenses
          path: |
            THIRD_PARTY_LICENSES.json
            THIRD_PARTY_LICENSES.md
          if-no-files-found: error
          retention-days: 1

  push:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # PR のブランチへ push する
      actions: write # ci.yml を workflow_dispatch で呼び直す
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # 作り直しの元と違う commit に積まない。動かした push がこの workflow を走らせ直す
      - name: ブランチが作り直しの元のままか
        id: head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" = "$EXPECTED" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
          else
            echo "ブランチが動いた（$EXPECTED → $actual）。積まずに終わる"
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.head.outputs.same == 'true'
        with:
          name: third-party-licenses
          path: .

      - name: commit して push する
        if: steps.head.outputs.same == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          others=$(git status --porcelain --untracked-files=all -- . ':!THIRD_PARTY_LICENSES.json' ':!THIRD_PARTY_LICENSES.md')
          if [ -n "$others" ]; then
            echo "error: artifact にライセンス一覧の外のファイルが入っていた。積まない" >&2
            echo "$others" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add THIRD_PARTY_LICENSES.json THIRD_PARTY_LICENSES.md
          git commit \
            -m "chore: 依存の更新に合わせてライセンス一覧を作り直す（#$PR_NUMBER）" \
            -m "Dependabot が上げた Cargo.lock から scripts/generate_licenses.sh で作り直した（.github/workflows/dependabot-licenses.yml）。"
          # force しない。作り直しの間に Dependabot が積み直していたら非 fast-forward で落ちる
          git push origin "HEAD:refs/heads/$HEAD_REF"

      - name: CI を呼び直す（GITHUB_TOKEN の push では required check が付かないため）
        if: steps.head.outputs.same == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
