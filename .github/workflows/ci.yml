name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定の GITHUB_TOKEN を読み取りのみに絞る（handball-project#284）。リポジトリ設定の
# default_workflow_permissions も read だが、設定は UI から変えられるので workflow 側にも
# 明示して差分に残す。この CI は checkout と成果物の検査だけで、書き込みを一切しない。
permissions:
  contents: read

# 同一ブランチで走行中のジョブは新しい push で打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Action は完全な commit SHA でピン留めする（handball-project#284）。`@v4` のような
# 可変タグは差し替えが効くので、タグを奪われるとランナーで任意コードが走る
# （tj-actions/changed-files 型の攻撃）。ruleset の SHA ピン留め必須も掛けてあるので、
# タグ参照に戻すと CI が起動しない。
#
# 追随するときは `git ls-remote --tags <repo>` で SHA を引き直し、**末尾コメントの
# バージョンも一緒に直す**こと。Dependabot（`.github/dependabot.yml`）が
# github-actions エコシステムで SHA とコメントの両方を上げる PR を出す。

jobs:
  check:
    # flake.nix は system = "aarch64-darwin" 固定なので Apple Silicon ランナーが必須
    # （macos-14 以降の macos-latest が arm64）。ローカル開発と同一の経路を検証する。
    runs-on: macos-latest

    # ── 所要時間の内訳と、速さのために取っている手（handball-project#386）──
    #
    # 2026-09-13 の実測で 1 run 5〜12 分のうち、ビルドとテストの本体は 1.5〜2 分しか
    # なかった。残りは (a) 最初の `nix develop` = ツールチェーン一式の取得と展開（2〜3.5 分）、
    # (b) cargo キャッシュの復元と保存（run_id 付きキーで毎回書き戻し、target/ が 5 GB まで
    # 肥大して 2〜3.5 分掛かる回があった）。docs 1 行の PR でも同じだけ待っていた。
    #
    #   手 1: Nix store を GitHub Actions のキャッシュに置く（nix-quick-install-action +
    #         cache-nix-action。無償・secret 不要）。flake.lock / flake.nix /
    #         rust-toolchain.toml が動かない限り保存し直さない
    #   手 2: cargo キャッシュも「キーが無いときだけ保存」に戻し、run_id を外す
    #   手 3: PR の変更が docs だけなら、ビルドと検査を全部飛ばして成功で抜ける（`scope`）
    #   手 4: cargo / Gradle キャッシュのキーから版番号を除き、版切りの PR と merge 後の main
    #         でも hit させる（`cache_keys`。handball-project#389）
    #   手 5: キャッシュを保存するのは main への push だけ。PR は復元だけして、キーが外れたら
    #         main の直近のものを前方一致で拾う（handball-project#404。下の「保存は main だけ」）
    #
    # 変更前後の実測は handball-project#386 に書いてある。
    #
    # ── 保存は main だけ（handball-project#404）──
    #
    # キャッシュはそれを保存した ref からしか使えない（PR の ref で保存したものを main も他の PR
    # も使えない）のに、以前は PR も保存していた。2026-09-21 は repo の総量が 21.4GB / 24 本で、
    # 上限の 10GB を倍超えていた。そのうち 16 本 14.7GB が PR の ref のもの:
    #
    #   - toolkit PR #77（ci.yml と flake を変更）の merge 直後、Dependabot が open な 3 本を
    #     rebase した。main がまだ新しいキーを保存していないので 3 本とも完全一致が外れ、
    #     それぞれが Nix 1.45GB・cargo・Gradle を自分の ref に丸ごと保存した。25 分で 15 本 15.1GB
    #   - 上限を超えた分は最終アクセスの古い順に消される。main の現役のキャッシュは、同じ時刻に
    #     作られた PR の重複より先に消される位置にあった。消されると次の PR はゼロから作り直す
    #
    # PR は保存しないので、キャッシュは main の分だけになる（現役 3 本で約 3GB。キーが変わって
    # 使われなくなったものは最終アクセスが古いので、上限を超えても先に消される）。代わりに PR
    # では Nix / cargo にも前方一致の fallback を付け、キーを変える PR（Dependabot・ci.yml や
    # flake を触る PR）でも main の直近のキャッシュを拾う。fallback が問題になるのは「古い
    # キャッシュの上に積み増したものを保存する」ときだけ（handball-project#386）で、PR は保存
    # しないので起きない。
    # main には従来どおり fallback を付けず、キーが変わった回はゼロから作って保存する。
    #
    # 保存のステップは job の最後にまとめてある。

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 下の `scope` が HEAD^1（PR の base）との差分を取るので、merge commit の両親まで要る。
          fetch-depth: 2

      # PR の変更が「読み物」だけなら、以降のビルドと検査を全部飛ばす。required check は
      # `check` ジョブの成功なので、**ジョブではなくステップを skip する**（workflow を
      # paths で走らせないと check が Pending のまま merge できない）。
      #
      # pull_request の checkout は「base へ merge した仮の commit」なので、HEAD^1（base の
      # 先端）との差分が、その PR が main に持ち込む変更そのもの。main への push では常に
      # 全部走らせる — merge 後の main を検証し、PR が使うキャッシュを main の ref で作る
      # 役目がある（PR ブランチで保存したキャッシュは他の ref から見えない）。
      #
      # **飛ばしてよいのは、ビルドにもテストにも検査にも読まれないファイルだけ。**
      # 次の 2 つは .md だが検査が読むので飛ばさない:
      #   - docs/ERROR_CODES.md … Android の DomainValidationMessagesTest が表を突合する
      #   - THIRD_PARTY_LICENSES.md … generate_licenses.sh --check が再生成して比較する
      # 検査が読むファイルを docs/ や .md に新しく足したら、ここの除外にも足すこと。
      - name: 変更の範囲を見る（docs だけなら以降を飛ばす）
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "push なので全部走らせる"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "--- 変更ファイル ---"
          echo "$changed"
          docs_only=true
          [ -n "$changed" ] || docs_only=false
          while IFS= read -r f; do
            case "$f" in
              docs/ERROR_CODES.md|THIRD_PARTY_LICENSES.md) docs_only=false ;;
              *.md|LICENSE|docs/*) ;;
              *) docs_only=false ;;
            esac
          done <<< "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "--- docs_only=$docs_only ---"

      - name: docs だけの変更なのでビルドと検査を飛ばして成功にする
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "変更は .md / LICENSE / docs/ だけ。以降のステップは skip（判定は上の scope）"

      # Nix を単一ユーザーモードで /nix に直接入れる（約 5 秒）。cachix/install-nix-action の
      # マルチユーザー（daemon）方式より速く、下の cache-nix-action が /nix を丸ごと復元
      # できる形になる。flakes は既定で有効。GitHub からの取得には GITHUB_TOKEN を使う。
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        if: steps.scope.outputs.docs_only != 'true'

      # /nix（store と DB）と Nix のフェッチャキャッシュを GitHub Actions のキャッシュに置く。
      # キーが完全一致したら保存し直さないので、flake.lock / flake.nix / rust-toolchain.toml
      # が動かない限り書き戻しは起きない。保存するのは main だけ（上の「保存は main だけ」）。
      # このアクションは復元と保存（post）が一体なので、`save` で main 以外の保存を止める。
      #
      # **main では前方一致の fallback（restore-prefixes-first-match）を付けない。** 古い store の
      # 上に新しいツールチェーンを重ねて保存すると、キーが変わるたびに肥大する（cargo キャッシュが
      # 5 GB になったのと同じ経路）。main の miss はゼロから取り直す（2〜3 分。flake.lock を
      # 動かすのは稀）。PR は保存しないので fallback を付ける。
      #
      # ガベージコレクションも掛けない（gc-max-store-size 未設定）。この job が使ったパスは
      # 全部要るし、`nix develop` は GC root を作らないので、GC するとツールチェーンごと消える。
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        if: steps.scope.outputs.docs_only != 'true'
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: ${{ github.ref != 'refs/heads/main' && format('nix-{0}-', runner.os) || '' }}
          save: ${{ github.ref == 'refs/heads/main' }}
          paths: |
            /nix
            ~/.cache/nix

      # 下の cargo / Gradle キャッシュのキーを作る。**どちらも版番号を除いてハッシュする**
      # （handball-project#389）。
      #
      # FFI を変えるたびに版を切る規約（CLAUDE.md）なので、版はよく動く。版切りの PR は
      # Cargo.toml / Cargo.lock / android/toolkit/build.gradle.kts の版を書き換えるだけで
      # 依存は何も変わらないのに、ファイルをそのままハッシュしていたので完全一致が外れていた。
      # v0.10.0（toolkit PR #65）では cargo がゼロからビルドし直し、PR 6m35s / main 7m02s
      # （キャッシュが効いた回は PR 2m50s / main 4m30s）。
      #
      #   cargo : Cargo.lock から、source 行を持たない package（= workspace の crate）の
      #           version 行だけを除く。依存のリストは残すので、workspace の crate が依存を
      #           増減したらキーは変わる
      #   Gradle: android/ と examples/android/ の *.gradle.kts / gradle.properties から、版の
      #           行を 2 つ除く。android/toolkit/build.gradle.kts の `val toolkitVersion = `
      #           （Gradle のビルドでは使われず、scripts/build_aar.sh が Cargo.toml と照合するため
      #           だけに置いてある）と、examples/android/app/build.gradle.kts の
      #           `implementation(files("libs/handball-toolkit-<版>.aar"))`（版切りのたびに動く。
      #           handball-project#412 でサンプルもビルドするようにしてキーに入った）
      #
      # **除く行が見つからなければ落とす。** 書式が変わって版がキーに戻っても CI は緑のまま
      # 遅くなるだけで、誰も気付けないため。Gradle 側は build_aar.sh の版照合と下の
      # 「Android サンプルをビルドして単体テストを回す」と同じ行に依存しているので、書き方を変えるときは揃えて直すこと。
      #
      # hashFiles は使わない。キャッシュの保存（post）で `with:` が評価し直され、`**` が
      # target/ を走査して落ちたことがある（下の cargo キャッシュのコメント）。ここで出した
      # 値は steps の出力なので、評価し直しても同じ値のまま。
      - name: キャッシュのキーを作る（版番号を除く）
        id: cache_keys
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail

          # Cargo.lock は空行区切りの [[package]] ブロックの並びなので、段落単位（RS = ""）で読む。
          # 変数への代入にしておくと、awk が落ちたときに set -e で止まる（パイプの途中だと止まらない）。
          lock=$(awk '
            BEGIN { RS = ""; ORS = "\n\n" }
            /^\[\[package\]\]/ && !/\nsource = / { n += sub(/\nversion = "[^"]*"/, "") }
            { print }
            END {
              if (n == 0) { print "error: Cargo.lock に workspace の crate の version 行が見つからない" > "/dev/stderr"; exit 1 }
            }
          ' Cargo.lock)
          cargo=$(printf '%s\n' "$lock" | cat - rust-toolchain.toml .github/workflows/ci.yml | shasum -a 256 | cut -d' ' -f1)

          if [ "$(grep -c '^val toolkitVersion = ' android/toolkit/build.gradle.kts)" != 1 ]; then
            echo "error: android/toolkit/build.gradle.kts に \`val toolkitVersion = \` の行がちょうど 1 つ無い" >&2
            exit 1
          fi
          if [ "$(grep -c 'implementation(files("libs/handball-toolkit-' examples/android/app/build.gradle.kts)" != 1 ]; then
            echo "error: examples/android/app/build.gradle.kts に .aar を参照する行がちょうど 1 つ無い" >&2
            exit 1
          fi
          gradle=$(
            for f in $(git ls-files 'android/*.gradle.kts' android/gradle.properties \
                                    'examples/android/*.gradle.kts' examples/android/gradle.properties); do
              echo "== $f"
              sed -e '/^val toolkitVersion = /d' -e '/implementation(files("libs\/handball-toolkit-/d' "$f"
            done | shasum -a 256 | cut -d' ' -f1
          )

          echo "cargo=$cargo" >> "$GITHUB_OUTPUT"
          echo "gradle=$gradle" >> "$GITHUB_OUTPUT"
          echo "cargo  のキー: $cargo"
          echo "gradle のキー: $gradle"

      # cargo のレジストリと target/ をキャッシュする（ツールチェーンは上の Nix store 側）。
      #
      # キーは Cargo.lock（workspace の crate の版を除く）/ rust-toolchain.toml / この workflow
      # のハッシュで（上の cache_keys）、**完全一致したら保存しない**。main では restore-keys
      # （前方一致の fallback）も置かない（PR だけに置く。上の「保存は main だけ」）。経緯:
      #
      #   - handball-project#143 では Cargo.lock のハッシュだけをキーにしていて、最初に
      #     保存された時点の target/（debug のみ）で凍結し、release と --features bindgen の
      #     成果物が毎回作り直されていた。そこで run_id を足して毎回書き戻す設計にした
      #   - その代償が handball-project#386 で出た。毎回 0.8 GB を書き戻し、restore-keys で
      #     前回の target/ を継ぎ足すので古い成果物が消えず 5 GB まで肥大（復元 216 秒 +
      #     保存 127 秒）。10 GB の上限で main のキャッシュが evict され、PR がゼロから
      #     ビルドする回も出ていた
      #   - handball-project#389 で、版切りの PR と merge 後の main が毎回 miss していたので、
      #     キーから workspace の crate の版を除いた
      #   - handball-project#404 で、保存を main だけにした。キーが変わる PR は、main の直近の
      #     キャッシュを前方一致で拾う
      #
      # いまは job の最後（release と bindgen も済んだ後）に一度だけ保存するので、#143 の
      # 「debug で凍結」は起きない。ビルドの構成を変える（ステップを足す）ときは、この
      # workflow 自体がキーに入っているので保存し直される。main の miss（依存やツールチェーン
      # の更新、この workflow の変更）のときはゼロから作る。Dependabot の週次の PR を merge
      # したときなどで、main の 1 回だけ。
      #
      # 版を上げても hit するので、保存済みの target/ は古い版の workspace crate を抱えたまま
      # 更新されない。workspace crate はソースを変えれば毎回ビルドし直すものなので、効くのは
      # 依存の成果物だけで足りる。hit では保存しないので、古い成果物が積み増されて #386 の
      # 肥大も起きない。
      #
      # **キーに hashFiles の `**` を戻さない。** かつて `hashFiles('**/Cargo.lock', ...)` に
      # していた頃、ワークスペースなので Cargo.lock は root の 1 本しかないのに target/ を含む
      # ツリー全体を走査し、ビルド後の post（キャッシュ保存）でだけ走査が失敗して
      # `hashFiles(...) failed. Fail to hash files under directory` で job が落ちていた
      # （復元時は target/ がまだ無いので通る。2026-09-12 に main でも再発）。いまのキーは
      # 上の cache_keys が出す値なので、この問題は起きない。
      #
      # 保存は job の最後の「cargo キャッシュを保存」。path と key はそこと揃えること。
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cargo_cache
        if: steps.scope.outputs.docs_only != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.cache_keys.outputs.cargo }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('cargo-{0}-', runner.os) || '' }}

      - name: cargo fmt
        if: steps.scope.outputs.docs_only != 'true'
        run: nix develop --command cargo fmt --all --check

      - name: cargo clippy
        if: steps.scope.outputs.docs_only != 'true'
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      # tests/golden/local/ は gitignore 済み（ローカル専用の拡張コーパス — ADR 0003 §1）。
      # 不在時は該当テストが自動でスキップされるので CI でも green になる。
      - name: cargo test
        if: steps.scope.outputs.docs_only != 'true'
        run: nix develop --command cargo test --workspace

      # wasm ターゲットのコンパイル検査（handball-project#206）。上の fmt / clippy /
      # test はすべて host 向けで、wasm 向けにビルドが通るかはどこでも試されていない。
      #
      # iOS は HandballRecorder の bootstrap.sh が回るたびに XCFramework を作り直すので
      # 壊れが自然に露見するが、**wasm には定常的な消費ループが無い**。LP のデモ
      # （handball-project#96）はビルド済みの成果物を配っているだけで、コアを直しても
      # 誰も wasm を作り直さない。`./scripts/build_wasm.sh` を手で叩くまで破損に
      # 気づけず、気づくのは「デモを更新したい時に更新できない」形になる。
      #
      # 生成まで回さず cargo check で足りる。狙いは「コンパイルできない wasm を main に
      # 入れない」ことだけで、デモが正しい結果を出すかの検証はここでは扱わない。
      #
      # 落ちたときに疑うところ:
      #   - **依存が getrandom を引き込んだ**。host は OS の乱数 API を勝手に使うので
      #     通るが、wasm はバックエンドを明示しないとコンパイルが通らない。この repo は
      #     意図的に未設定 — コアも wasm crate も UUID を生成せず、ID はシェル（JS の
      #     `crypto.randomUUID()`）が発行する（設計不変条件 2）。バックエンド設定を
      #     足す前に、その依存が本当に要るかを疑うこと
      #   - **wasm-bindgen のバージョン不一致**。crate 側（Cargo.toml の `=` ピン）と
      #     flake が入れる wasm-bindgen-cli は完全一致が必要。flake 側は版付きの属性
      #     （wasm-bindgen-cli_0_2_NNN）で名指しするので、上げるときは両方を同時に変える
      - name: cargo check（wasm32）
        if: steps.scope.outputs.docs_only != 'true'
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p handball-toolkit-wasm

      # 配布バイナリの OSS ライセンス一覧が依存の現況と一致するかを検査する
      # （handball-project#140）。依存を足して再生成を忘れると、シェルが表示する
      # 一覧から crate が欠けて表示義務を取りこぼすため、ここで止める。
      # accepted に無いライセンスの混入もこのステップが検出する（about.toml）。
      - name: ライセンス一覧が最新か
        if: steps.scope.outputs.docs_only != 'true'
        run: nix develop --command ./scripts/generate_licenses.sh --check

      # 依存に既知の脆弱性（RustSec advisory-db）が出ていないか、取得元が crates.io 以外に
      # なっていないかを検査する（handball-project#285。設定は deny.toml）。
      #
      # ライセンスは上の cargo-about が担うので、ここでは advisories / sources だけ。
      # 依存が変わらなくても advisory-db は日々増えるため、**PR の無い期間に赤くなる
      # ことがない**（push / PR でしか走らない）— 週次 cron は親リポの検査 CI と同じく
      # 別途足すか、Dependabot の security updates で補う。
      #
      # 落ちたときに疑うところ:
      #   - advisory の ID が名指しで出る。直せる版があれば `cargo update -p <crate>`。
      #     無いなら deny.toml の `[advisories] ignore` に **理由つき**で足す（期限も書く）
      #   - `unmaintained` は warn のまま（落とさない）。メンテ停止は脆弱性ではなく、
      #     uniffi 一式のような選択肢の無い依存で赤くなり続けると検査が無視されるため
      - name: 依存の既知脆弱性と取得元（cargo-deny）
        if: steps.scope.outputs.docs_only != 'true'
        run: nix develop --command cargo deny check advisories sources

      # ── ここから Android 配布物（.aar）の JVM 単体テスト（handball-project#143）──
      #
      # 狙いは `values-ja` の足し忘れ検出。既定ロケールの漏れは写像の `when` が
      # 非網羅になってコンパイルが落ちるが、**日本語側の漏れはコンパイラに見えない**
      # （実行時に黙って既定ロケールへ落ちる）。見張れるのはこのテストだけで、
      # #136 まではローカル実行に頼っていた。
      #
      # **NDK は要らない**。ADR 0006 決定 3 で crate-type に cdylib を足したので host
      # ビルドでも .dylib が出る。uniffi の bindgen は library mode でライブラリ内の
      # メタデータから生成するため、そこから Kotlin を作れる（Android の .so から
      # 生成したものとバイト単位で一致することを #143 で確認済み）。実機用 .so も
      # 端末も不要 — シムは生成 data class を組み替えるだけでネイティブに触らない。
      # したがって ADR 0006 決定 1（NDK / SDK は repo の flake が持たない）と衝突しない。

      - name: Android SDK の状態を確認
        id: android_sdk
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=${ANDROID_HOME:-(unset)}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-(unset)}"
          if [ -n "$root" ] && [ -d "$root/platforms" ]; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
            echo "ANDROID_HOME=$root" >> "$GITHUB_ENV"
            echo "--- ランナー同梱の SDK を使う: $root ---"
            ls "$root"
            echo "--- platforms ---";    ls "$root/platforms"    || true
            echo "--- build-tools ---";  ls "$root/build-tools"  || true
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
            echo "--- ランナーに SDK が無い。次のステップで導入する ---"
          fi

      # ランナー同梱の SDK が無い場合のみ導入する。compileSdk = 36 /
      # buildToolsVersion = "37.0.0"（android/toolkit/build.gradle.kts）に対応させる。
      # 上のステップが skip されると outputs は空（!= 'true'）なので、docs_only も見る。
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        if: steps.scope.outputs.docs_only != 'true' && steps.android_sdk.outputs.preinstalled != 'true'
        with:
          packages: 'platforms;android-36 build-tools;37.0.0'

      # Gradle は flake が提供する（pkgs.gradle_9。ADR 0006 実装追記 2026-07-28 / 2026-09-21）が、
      # AGP / Kotlin プラグインと依存 jar は Maven から引くのでキャッシュする。
      #
      # キーは android/ と examples/android/ の *.gradle.kts と gradle.properties のハッシュで、
      # 版の行を除いてある（上の cache_keys。handball-project#389 / #412）。版を上げるだけの PR で
      # 保存し直さないため。
      #
      # **cargo / Nix と違って、ここだけ restore-keys（前方一致の fallback）を残してある。**
      # 肥大していないことを実測で確かめたうえでの例外（handball-project#394。2026-09-16）:
      #
      #   - 保存サイズは 2026-08-09 の初回 294MB → 08-20 に 396MB へ一度だけ増え、そこから
      #     09-14 まで 10 回以上キーが変わっても 396〜407MB。減る回もあり増加傾向は無い
      #   - 08-20 の +102MB は積み増しではない。`.aar` の assembleRelease を足した 08-09 以降も
      #     キーが完全一致し続けて保存が起きず（hit では保存しない）、08-20 の版切りで初めて
      #     release 経路ぶんが書き戻された一度きりの取り込み
      #   - cargo の target/ と違い ~/.gradle/caches は依存 jar が主で、ビルド成果物を
      #     積み増す構造ではない（handball-project#386 の経路に乗らない）
      #
      # 残す理由は、#389 でキーから版を除いた結果、**キーが動くのは依存が実際に変わる回**
      # **だけ**になったこと。そこで fallback を外すと、変わっていない依存まで Maven から
      # 取り直して 1〜2 分増える。
      #
      # **その「依存が実際に変わる回」は Dependabot の `gradle-android` / `gradle-examples`
      # の 2 グループ。** 2026-09-17 の確認時点ではキーが android/ しか見ず、ビルドも `-p android`
      # だけだったので `gradle-examples` の PR はキーを動かさなかった。handball-project#412 で
      # examples/android もビルドしてキーに入れたので、今はどちらも動かす。
      #
      #   - 復元は fallback でも primary hit と変わらない。キーが外れた回（#39 の 09-17 run）は
      #     `gradle-macOS-` で前の 408MB を拾って約 12 秒。同じ日に primary hit した回（#74）も
      #     408MB で約 11 秒
      #
      # 依存が変わった回の**保存**サイズ（handball-project#404。2026-09-21 の実測）:
      #
      #   - #412（AGP 9 への移行と examples の KSP / Room の取り込み）の merge 後、main は
      #     899MB を保存した。400MB 前後から倍になった（AGP 9 と examples のどちらの分かは
      #     分けて測っていない）
      #   - Dependabot の AGP 9.4.0 → 9.4.1 の PR（toolkit #78 / #79）は、fallback で 899MB を
      #     拾って 969MB を保存した。古い AGP を抱えたまま新しい AGP を足した +70MB
      #   - **未観測**: 保存を main だけにした後で、main でキーが動くたびに増え続けないか。
      #     Gradle は既定で 30 日使われない依存を消すが、CI のキャッシュ越しに効くかは
      #     確かめていない
      #
      # 保存は job の最後の「Gradle キャッシュを保存」。path と key はそこと揃えること。
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: gradle_cache
        if: steps.scope.outputs.docs_only != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ steps.cache_keys.outputs.gradle }}
          restore-keys: gradle-${{ runner.os }}-

      - name: host 向け cdylib をビルド（NDK 不要）
        if: steps.scope.outputs.docs_only != 'true'
        run: nix develop --command cargo build --release -p handball-toolkit-ffi

      - name: Kotlin バインディングを生成（host の .dylib から）
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          nix develop --command cargo run -q -p handball-toolkit-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/release/libhandball_toolkit_ffi.dylib \
            --language kotlin --out-dir android/toolkit/src/generated/kotlin --no-format

      # 文言リソースの網羅性と docs/ERROR_CODES.md の追随もここで検査する
      # （DomainValidationMessagesTest。handball-project#358）。件数は書かない —
      # 書き写した値はテストを足すたびにずれ、機械が見ていないので気付けない。
      - name: Kotlin シムの単体テスト
        if: steps.scope.outputs.docs_only != 'true'
        run: nix develop --command gradle -p android :toolkit:testDebugUnitTest --console=plain

      # 依存 OSS のライセンス一覧が .aar に入るか（handball-project#142）。同梱が
      # 抜けると、.aar を受け取った側は表示義務を果たす材料を持たないまま配ることに
      # なる。scripts/build_aar.sh は NDK を要求して前段で止まるので、ここでは
      # assets の配置だけ再現して assembleRelease を回す。jni/ が空の .aar になるが、
      # 同梱漏れの検出はこれで足りる（実機 .so を載せたフルビルドはリリース時）。
      #
      # **build_aar.sh の手順 4/5 と同じ内容を書いている。片方を直したらもう片方も
      # 直すこと。** gradle 側へ寄せて単一化する案は見送った — .aar を作る経路は
      # build_aar.sh 1 本で、二重管理の実害がまだ無いため。
      - name: ライセンス一覧が .aar に入るか
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          asset_dir=android/toolkit/src/main/assets/handball_toolkit
          rm -rf android/toolkit/src/main/assets
          mkdir -p "$asset_dir"
          cp THIRD_PARTY_LICENSES.json "$asset_dir/third-party-licenses.json"
          nix develop --command gradle -p android --quiet :toolkit:assembleRelease
          # 見つからなければ grep が非ゼロで返り、このステップが落ちる。
          unzip -l android/toolkit/build/outputs/aar/toolkit-release.aar \
            | grep -F 'assets/handball_toolkit/third-party-licenses.json'

      # Android サンプルシェル（examples/android）をビルドする（handball-project#412）。
      #
      # ここまでは `-p android` しか回しておらず、examples/android は誰もビルドしていなかった。
      # そのため Dependabot の `gradle-examples` の PR（AGP 9.4.0 を含む toolkit#74）は、
      # 同じ AGP で `gradle-android` の #39 が Gradle の版不足で落ちているのに緑だった。
      # サンプルの `.aar` の参照も 0.2.0 のまま 0.11.0 まで取り残されていた。
      #
      # 上のステップで組んだ `.aar`（jni/ は空）を、サンプルが参照する名前で app/libs/ に置く。
      # サンプルは外部利用者と同じく配布 `.aar` を引く作りなので、Release から落とす代わりに
      # いまのソースから組んだものを渡す — `.aar` の API とサンプルのずれもここで落ちる。
      # 実機での動作（.so のロード・Room の実行）は見ない。
      #
      # **版は toolkitVersion から決め、サンプル側の参照と突き合わせる。** ずれたまま Gradle に
      # 渡すと、落ちても原因が版の直し忘れだと読み取りにくいので、先に理由つきで止める。
      #
      # 単体テストも回す（handball-project#405）。サンプルの `factLog` の ORDER BY はコアの
      # `persistence_order` を SQL で書き写したもので、コアと共有する fixture
      # （crates/handball-toolkit/tests/fixtures/persistence-order-cases.json）と突き合わせる。
      # 突き合わせる前は、handball-project#401 の段がサンプルへ入らないまま誰も気付かなかった。
      - name: Android サンプルをビルドして単体テストを回す
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^val toolkitVersion = "\(.*\)"$/\1/p' android/toolkit/build.gradle.kts)
          aar="handball-toolkit-$version.aar"
          if ! grep -qF "implementation(files(\"libs/$aar\"))" examples/android/app/build.gradle.kts; then
            echo "error: examples/android/app/build.gradle.kts が libs/$aar を参照していない（toolkitVersion = $version）。版を上げたらサンプルの参照も直すこと" >&2
            exit 1
          fi
          mkdir -p examples/android/app/libs
          cp android/toolkit/build/outputs/aar/toolkit-release.aar "examples/android/app/libs/$aar"
          nix develop --command gradle -p examples/android :app:assembleDebug :app:testDebugUnitTest --console=plain

      # ── キャッシュの保存（main だけ。上の「保存は main だけ」）──
      #
      # 以前の actions/cache が post で保存していたのと同じく、job の最後に置き、キーが
      # 完全一致して復元できた回は保存しない。前のステップが落ちたら保存しない（actions/cache の
      # post と同じ）。Nix は cache-nix-action の post が保存する（`save` で main に絞ってある）。
      #
      # **cargo キャッシュは release と bindgen のビルドより後で保存する。** 前に置くと
      # handball-project#143 の「debug のまま凍結」に戻る。
      - name: cargo キャッシュを保存
        if: steps.scope.outputs.docs_only != 'true' && github.ref == 'refs/heads/main' && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.cache_keys.outputs.cargo }}

      - name: Gradle キャッシュを保存
        if: steps.scope.outputs.docs_only != 'true' && github.ref == 'refs/heads/main' && steps.gradle_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ steps.cache_keys.outputs.gradle }}
