name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定の GITHUB_TOKEN を読み取りのみに絞る（handball-project#284）。リポジトリ設定の
# default_workflow_permissions も read だが、設定は UI から変えられるので workflow 側にも
# 明示して差分に残す。この CI は checkout と成果物の検査だけで、書き込みを一切しない。
permissions:
  contents: read

# 同一ブランチで走行中のジョブは新しい push で打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Action は完全な commit SHA でピン留めする（handball-project#284）。`@v4` のような
# 可変タグは差し替えが効くので、タグを奪われるとランナーで任意コードが走る
# （tj-actions/changed-files 型の攻撃）。ruleset の SHA ピン留め必須も掛けてあるので、
# タグ参照に戻すと CI が起動しない。
#
# 追随するときは `git ls-remote --tags <repo>` で SHA を引き直し、**末尾コメントの
# バージョンも一緒に直す**こと。Dependabot（`.github/dependabot.yml`）が
# github-actions エコシステムで SHA とコメントの両方を上げる PR を出す。

jobs:
  check:
    # flake.nix は system = "aarch64-darwin" 固定なので Apple Silicon ランナーが必須
    # （macos-14 以降の macos-latest が arm64）。ローカル開発と同一の経路を検証する。
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # ツールチェーンは rust-toolchain.toml 経由で rust-overlay が供給する（rustup 不使用）。
      # cargo のレジストリと target/ だけをキャッシュする。
      #
      # キーに run_id を足して**毎回書き戻す**。Cargo.lock のハッシュだけを主キーに
      # すると完全一致してしまい、actions/cache は「Cache hit occurred on the primary
      # key, not saving cache」で新しい成果物を一切保存しない。その結果 target/ は
      # 最初に保存された時点の内容（debug のみ）で凍結され、release プロファイルや
      # --features bindgen の成果物が毎回ゼロから作り直されていた（handball-project#143
      # の実測で判明。cdylib ビルド 45 秒 + bindgen 76 秒が毎回発生していた）。
      # restore-keys は「同じ Cargo.lock の直近」→「任意の直近」の順に落とす。
      #
      # **Cargo.lock は `**` を付けず直下だけを指す。** ワークスペースなので Cargo.lock は
      # root の 1 本しかなく、`**/Cargo.lock` にするとハッシュ値は同じまま target/ を含む
      # ツリー全体を走査する。ビルド後の post（キャッシュ保存）でだけ走査が失敗し、
      # `hashFiles(...) failed. Fail to hash files under directory` で job が落ちていた
      # （復元時は target/ がまだ無いので通る）。2026-09-12 に main でも再発。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-

      - name: cargo fmt
        run: nix develop --command cargo fmt --all --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      # tests/golden/local/ は gitignore 済み（ローカル専用の拡張コーパス — ADR 0003 §1）。
      # 不在時は該当テストが自動でスキップされるので CI でも green になる。
      - name: cargo test
        run: nix develop --command cargo test --workspace

      # wasm ターゲットのコンパイル検査（handball-project#206）。上の fmt / clippy /
      # test はすべて host 向けで、wasm 向けにビルドが通るかはどこでも試されていない。
      #
      # iOS は HandballRecorder の bootstrap.sh が回るたびに XCFramework を作り直すので
      # 壊れが自然に露見するが、**wasm には定常的な消費ループが無い**。LP のデモ
      # （handball-project#96）はビルド済みの成果物を配っているだけで、コアを直しても
      # 誰も wasm を作り直さない。`./scripts/build_wasm.sh` を手で叩くまで破損に
      # 気づけず、気づくのは「デモを更新したい時に更新できない」形になる。
      #
      # 生成まで回さず cargo check で足りる。狙いは「コンパイルできない wasm を main に
      # 入れない」ことだけで、デモが正しい結果を出すかの検証はここでは扱わない。
      #
      # 落ちたときに疑うところ:
      #   - **依存が getrandom を引き込んだ**。host は OS の乱数 API を勝手に使うので
      #     通るが、wasm はバックエンドを明示しないとコンパイルが通らない。この repo は
      #     意図的に未設定 — コアも wasm crate も UUID を生成せず、ID はシェル（JS の
      #     `crypto.randomUUID()`）が発行する（設計不変条件 2）。バックエンド設定を
      #     足す前に、その依存が本当に要るかを疑うこと
      #   - **wasm-bindgen のバージョン不一致**。crate 側（Cargo.toml の `=` ピン）と
      #     flake が入れる wasm-bindgen-cli は完全一致が必要。nixpkgs が上がったら
      #     両方を同時に合わせる
      - name: cargo check（wasm32）
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p handball-toolkit-wasm

      # 配布バイナリの OSS ライセンス一覧が依存の現況と一致するかを検査する
      # （handball-project#140）。依存を足して再生成を忘れると、シェルが表示する
      # 一覧から crate が欠けて表示義務を取りこぼすため、ここで止める。
      # accepted に無いライセンスの混入もこのステップが検出する（about.toml）。
      - name: ライセンス一覧が最新か
        run: nix develop --command ./scripts/generate_licenses.sh --check

      # 依存に既知の脆弱性（RustSec advisory-db）が出ていないか、取得元が crates.io 以外に
      # なっていないかを検査する（handball-project#285。設定は deny.toml）。
      #
      # ライセンスは上の cargo-about が担うので、ここでは advisories / sources だけ。
      # 依存が変わらなくても advisory-db は日々増えるため、**PR の無い期間に赤くなる
      # ことがない**（push / PR でしか走らない）— 週次 cron は親リポの検査 CI と同じく
      # 別途足すか、Dependabot の security updates で補う。
      #
      # 落ちたときに疑うところ:
      #   - advisory の ID が名指しで出る。直せる版があれば `cargo update -p <crate>`。
      #     無いなら deny.toml の `[advisories] ignore` に **理由つき**で足す（期限も書く）
      #   - `unmaintained` は warn のまま（落とさない）。メンテ停止は脆弱性ではなく、
      #     uniffi 一式のような選択肢の無い依存で赤くなり続けると検査が無視されるため
      - name: 依存の既知脆弱性と取得元（cargo-deny）
        run: nix develop --command cargo deny check advisories sources

      # ── ここから Android 配布物（.aar）の JVM 単体テスト（handball-project#143）──
      #
      # 狙いは `values-ja` の足し忘れ検出。既定ロケールの漏れは写像の `when` が
      # 非網羅になってコンパイルが落ちるが、**日本語側の漏れはコンパイラに見えない**
      # （実行時に黙って既定ロケールへ落ちる）。見張れるのはこのテストだけで、
      # #136 まではローカル実行に頼っていた。
      #
      # **NDK は要らない**。ADR 0006 決定 3 で crate-type に cdylib を足したので host
      # ビルドでも .dylib が出る。uniffi の bindgen は library mode でライブラリ内の
      # メタデータから生成するため、そこから Kotlin を作れる（Android の .so から
      # 生成したものとバイト単位で一致することを #143 で確認済み）。実機用 .so も
      # 端末も不要 — シムは生成 data class を組み替えるだけでネイティブに触らない。
      # したがって ADR 0006 決定 1（NDK / SDK は repo の flake が持たない）と衝突しない。

      - name: Android SDK の状態を確認
        id: android_sdk
        run: |
          root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=${ANDROID_HOME:-(unset)}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-(unset)}"
          if [ -n "$root" ] && [ -d "$root/platforms" ]; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
            echo "ANDROID_HOME=$root" >> "$GITHUB_ENV"
            echo "--- ランナー同梱の SDK を使う: $root ---"
            ls "$root"
            echo "--- platforms ---";    ls "$root/platforms"    || true
            echo "--- build-tools ---";  ls "$root/build-tools"  || true
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
            echo "--- ランナーに SDK が無い。次のステップで導入する ---"
          fi

      # ランナー同梱の SDK が無い場合のみ導入する。compileSdk = 36 /
      # buildToolsVersion = "37.0.0"（android/toolkit/build.gradle.kts）に対応させる。
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        if: steps.android_sdk.outputs.preinstalled != 'true'
        with:
          packages: 'platforms;android-36 build-tools;37.0.0'

      # Gradle は flake が提供する（pkgs.gradle。ADR 0006 実装追記 2026-07-28）が、
      # AGP / Kotlin プラグインと依存 jar は Maven から引くのでキャッシュする。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: host 向け cdylib をビルド（NDK 不要）
        run: nix develop --command cargo build --release -p handball-toolkit-ffi

      - name: Kotlin バインディングを生成（host の .dylib から）
        run: |
          nix develop --command cargo run -q -p handball-toolkit-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/release/libhandball_toolkit_ffi.dylib \
            --language kotlin --out-dir android/toolkit/src/generated/kotlin --no-format

      # 文言リソースの網羅性と docs/ERROR_CODES.md の追随もここで検査する
      # （DomainValidationMessagesTest。handball-project#358）。件数は書かない —
      # 書き写した値はテストを足すたびにずれ、機械が見ていないので気付けない。
      - name: Kotlin シムの単体テスト
        run: nix develop --command gradle -p android :toolkit:testDebugUnitTest --console=plain

      # 依存 OSS のライセンス一覧が .aar に入るか（handball-project#142）。同梱が
      # 抜けると、.aar を受け取った側は表示義務を果たす材料を持たないまま配ることに
      # なる。scripts/build_aar.sh は NDK を要求して前段で止まるので、ここでは
      # assets の配置だけ再現して assembleRelease を回す。jni/ が空の .aar になるが、
      # 同梱漏れの検出はこれで足りる（実機 .so を載せたフルビルドはリリース時）。
      #
      # **build_aar.sh の手順 4/5 と同じ内容を書いている。片方を直したらもう片方も
      # 直すこと。** gradle 側へ寄せて単一化する案は見送った — .aar を作る経路は
      # build_aar.sh 1 本で、二重管理の実害がまだ無いため。
      - name: ライセンス一覧が .aar に入るか
        run: |
          asset_dir=android/toolkit/src/main/assets/handball_toolkit
          rm -rf android/toolkit/src/main/assets
          mkdir -p "$asset_dir"
          cp THIRD_PARTY_LICENSES.json "$asset_dir/third-party-licenses.json"
          nix develop --command gradle -p android --quiet :toolkit:assembleRelease
          # 見つからなければ grep が非ゼロで返り、このステップが落ちる。
          unzip -l android/toolkit/build/outputs/aar/toolkit-release.aar \
            | grep -F 'assets/handball_toolkit/third-party-licenses.json'
