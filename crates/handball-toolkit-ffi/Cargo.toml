[package]
name = "handball-toolkit-ffi"
version.workspace = true
edition.workspace = true

# FFI パッケージング crate。uniffi の型・関数公開はコア crate（feature `uniffi`）の
# namespace に集約し（ADR 0004）、ここは staticlib 化と bindgen CLI の同居だけを担う。

[lib]
# staticlib: iOS へは静的リンクで届ける（XCFramework の中身）。lib は host テスト用。
crate-type = ["lib", "staticlib"]

[[bin]]
# バインディング生成 CLI（uniffi 標準の同居パターン）。
# feature gate により iOS 向け staticlib ビルドへ CLI 依存（clap 等)を混ぜない。
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["dep:uniffi", "uniffi/cli"]

[dependencies]
# feature `uniffi` でコアの derive + export を有効化し、staticlib にメタデータを集約する。
handball-toolkit = { path = "../handball-toolkit", features = ["uniffi"] }
uniffi = { version = "0.32", optional = true }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1" }
