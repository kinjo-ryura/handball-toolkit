# この crate（namespace: handball_toolkit）の Swift バインディング生成設定。
# ffi crate と同じモジュール名に揃え、生成 Swift を 1 つの Swift モジュールへまとめる — ADR 0004 決定 8。
[bindings.swift]
module_name = "HandballToolkit"

# Uuid（String ブリッジ — src/ffi_support.rs）を Swift の Foundation UUID へ写す。
[bindings.swift.custom_types.Uuid]
type_name = "UUID"
imports = ["Foundation"]
into_custom = "UUID(uuidString: {})!"
from_custom = "{}.uuidString"

# ID newtype（handball-project#52。String ブリッジ — src/ffi_support.rs）も同様に UUID へ写す。
# Swift 側の API 面は newtype 化前（全部 UUID）と変わらない。
[bindings.swift.custom_types.MatchId]
type_name = "UUID"
imports = ["Foundation"]
into_custom = "UUID(uuidString: {})!"
from_custom = "{}.uuidString"

[bindings.swift.custom_types.TeamId]
type_name = "UUID"
imports = ["Foundation"]
into_custom = "UUID(uuidString: {})!"
from_custom = "{}.uuidString"

[bindings.swift.custom_types.PlayerId]
type_name = "UUID"
imports = ["Foundation"]
into_custom = "UUID(uuidString: {})!"
from_custom = "{}.uuidString"

[bindings.swift.custom_types.FactId]
type_name = "UUID"
imports = ["Foundation"]
into_custom = "UUID(uuidString: {})!"
from_custom = "{}.uuidString"

# PhaseIndex（usize → u32 ブリッジ — src/ffi_support.rs）を Swift の Int へ写す（ADR 0004 決定 6）。
# 移植元 API は `currentPhaseIndex: Int?` 等の Int で、同名フィールドはシム extension で覆えないため
# バインディング層で写像する。公開 API 上 PhaseIndex は出力方向のみ（引数に取る関数なし）で、
# from_custom の UInt32 変換がトラップし得るのは Swift 側が負値を lower する経路に限られる。
[bindings.swift.custom_types.PhaseIndex]
type_name = "Int"
into_custom = "Int({})"
from_custom = "UInt32({})"
