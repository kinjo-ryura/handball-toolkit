[package]
name = "handball-toolkit-wasm"
version.workspace = true
edition.workspace = true

# wasm パッケージング crate。JS から呼べる粗粒度エントリの公開と境界のマーシャリングだけを
# 担い、型・ロジックはコア crate に置いたまま触らない（FFI crate と同じ位置づけ — ADR 0004）。

[lib]
# cdylib: wasm-bindgen が読む .wasm の実体。lib: host でのテスト用（純粋関数部分を native で回す）。
crate-type = ["cdylib", "lib"]

[dependencies]
# コアは feature 無し（default off）で取る = uniffi が依存グラフごと消える（ADR 0004）。
handball-toolkit = { path = "../handball-toolkit" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# wasm-bindgen は生成ツール（wasm-bindgen-cli）と**バージョン完全一致**が必要。
# flake.nix が nixpkgs から入れる CLI に合わせて `=` でピン留めする（更新は両方同時に）。
wasm-bindgen = "=0.2.121"
# JS が渡す UUID 文字列の parse に使う。v4 は入れない（コアも本 crate も UUID を生成しない
# = getrandom の wasm バックエンド設定が要らない — 設計不変条件 2）。
uuid = { version = "1", features = ["serde"] }
