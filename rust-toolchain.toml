# Rust ツールチェーンの宣言（Nix の rust-overlay がこのファイルを読む。rustup は不使用）。
# バージョンを上げるときは channel を書き換えて direnv reload。
[toolchain]
channel = "1.97.0"
components = ["clippy", "rustfmt", "rust-analyzer"]
# クロスターゲット。
# iOS の 2 つは UniFFI → XCFramework 用（実機 / Apple Silicon シミュレータ。ABI が別物なので両方要る）。
# wasm32 は wasm-bindgen → Web デモ用（handball-project#57）。
# aarch64-linux-android は UniFFI → Kotlin バインディング用（Android シェル・handball-project#59）。
# staticlib のコンパイルは NDK 不要（rustc がアーカイブするだけ）。.so 生成には別途 NDK リンカが要る。
targets = ["aarch64-apple-ios", "aarch64-apple-ios-sim", "wasm32-unknown-unknown", "aarch64-linux-android"]
